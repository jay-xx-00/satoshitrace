name: Build & Publish Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'satoshitrace/backend/requirements.txt'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r satoshitrace/backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: ./sato
        run: |
          npm ci || npm install --prefer-offline

      - name: Build Frontend Production Artifacts
        working-directory: ./sato
        run: |
          npm run build || true

      - name: Package Linux Standalone Distribution
        run: |
          VERSION="${{ github.ref_name || github.event.inputs.version || 'v1.0.0' }}"
          DIST_DIR="satoshitrace-linux"
          mkdir -p "$DIST_DIR"

          # Copy application codebase
          cp -r run.sh install.sh Dockerfile docker-compose.yml satoshitrace.desktop README.md TECHNICAL_REPORT.md "$DIST_DIR/"
          cp -r satoshitrace "$DIST_DIR/"
          cp -r sato "$DIST_DIR/"
          
          # Strip heavy node_modules and build caches so extraction never fails on Linux
          rm -rf "$DIST_DIR/sato/node_modules"
          rm -rf "$DIST_DIR/sato/.output" "$DIST_DIR/sato/.vinxi" "$DIST_DIR/sato/.wrangler"
          find "$DIST_DIR" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$DIST_DIR" -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
          find "$DIST_DIR" -type f -name "*.pyc" -delete 2>/dev/null || true
          find "$DIST_DIR" -name ".DS_Store" -delete 2>/dev/null || true

          # Make launcher scripts executable
          chmod +x "$DIST_DIR/run.sh" "$DIST_DIR/install.sh" "$DIST_DIR/satoshitrace/run.sh" 2>/dev/null || true

          # Create compressed tarball
          ARCHIVE_NAME="satoshitrace-linux-x86_64.tar.gz"
          tar -czf "$ARCHIVE_NAME" "$DIST_DIR"
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: "SatoshiTrace ${{ github.ref_name || github.event.inputs.version }} (Linux Air-Gapped Release)"
          draft: false
          prerelease: false
          body: |
            ## ₿ SatoshiTrace — Bitcoin Forensic Intelligence Platform (SIH 2026 #26146)
            
            This release contains the Linux distribution for offline, air-gapped forensic investigations.

            ### 🚀 Quick Start on Linux:
            ```bash
            # 1. Download and extract
            tar -xzf satoshitrace-linux-x86_64.tar.gz
            cd satoshitrace-linux

            # 2. One-click setup (desktop shortcut & dependencies)
            chmod +x install.sh run.sh
            ./install.sh

            # 3. Launch platform
            ./run.sh
            ```

            ### 🐳 Docker Quick Start:
            ```bash
            docker compose up --build
            ```
            - Web UI: http://localhost:8080
            - API Docs: http://127.0.0.1:8000/docs
          files: |
            satoshitrace-linux-x86_64.tar.gz
            satoshitrace-linux-x86_64.tar.gz.sha256
