services:
  satoshitrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satoshitrace_platform
    restart: unless-stopped
    ports:
      - "8085:8080"
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./satoshitrace/backend/data:/app/satoshitrace/backend/data
