<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanTick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Deep tactical badge background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Outer reticle ring -->
  <circle cx="32" cy="32" r="26.5" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.35" />
  <!-- Dashed tracking orbit -->
  <circle cx="32" cy="32" r="20" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6.5 4.5" stroke-opacity="0.95" />

  <!-- Cyber forensic axis ticks -->
  <line x1="32" y1="2" x2="32" y2="11" stroke="url(#cyanTick)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="53" x2="32" y2="62" stroke="url(#cyanTick)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="2" y1="32" x2="11" y2="32" stroke="url(#cyanTick)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="53" y1="32" x2="62" y2="32" stroke="url(#cyanTick)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Corner forensic indicators -->
  <circle cx="13" cy="13" r="1.5" fill="#38bdf8" opacity="0.75" />
  <circle cx="51" cy="13" r="1.5" fill="#38bdf8" opacity="0.75" />
  <circle cx="13" cy="51" r="1.5" fill="#38bdf8" opacity="0.75" />
  <circle cx="51" cy="51" r="1.5" fill="#38bdf8" opacity="0.75" />

  <!-- Dual Bitcoin Vertical Spines -->
  <line x1="29.5" y1="14" x2="29.5" y2="18.5" stroke="url(#amberGlow)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="34.5" y1="14" x2="34.5" y2="18.5" stroke="url(#amberGlow)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="29.5" y1="45.5" x2="29.5" y2="50" stroke="url(#amberGlow)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="34.5" y1="45.5" x2="34.5" y2="50" stroke="url(#amberGlow)" stroke-width="2.4" stroke-linecap="round" />

  <!-- Bitcoin Currency Glyph -->
  <path d="M25 18.5 H35.5 C39.5 18.5 42 20.8 42 24.2 C42 26.6 40.5 28.5 38 29.3 C41.2 30.1 43 32.4 43 35.8 C43 39.8 39.8 42.5 35 42.5 H25 V18.5 Z 
           M29.5 22.5 V28.5 H34.5 C36.8 28.5 38 27.3 38 25.5 C38 23.7 36.8 22.5 34.5 22.5 Z 
           M29.5 32.5 V38.5 H35 C37.5 38.5 38.8 37.2 38.8 35.5 C38.8 33.8 37.5 32.5 35 32.5 Z" 
        fill="url(#amberGlow)" fill-rule="evenodd" />
</svg>